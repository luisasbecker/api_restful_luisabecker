services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-task-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-task-api-client}
      JWT_MINUTES: ${JWT_MINUTES:-30}
      BOOTSTRAP_NAME: ${BOOTSTRAP_NAME:-}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12

  test-db:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-task_api_test}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER} -d ${TEST_POSTGRES_DB:-task_api_test}"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    build: .
    profiles: ["test"]
    command: ["pytest", "--cov=src/task_api", "--cov-report=term-missing", "--cov-report=xml:artifacts/coverage.xml", "--cov-report=html:artifacts/htmlcov", "--cov-report=json:artifacts/coverage-lines.json", "--cov-fail-under=60"]
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql+psycopg://${TEST_POSTGRES_USER}:${TEST_POSTGRES_PASSWORD}@test-db:5432/${TEST_POSTGRES_DB:-task_api_test}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - test_artifacts:/app/artifacts
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  app_pgdata:
  test_pgdata:
  test_artifacts:
