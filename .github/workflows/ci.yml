name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_api_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d task_api_ci_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/task_api_ci_test
      JWT_SECRET: ci-only-secret-at-least-thirty-two-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.6"
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=src/task_api --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml --cov-report=html:artifacts/htmlcov --cov-report=json:artifacts/coverage-lines.json --cov-fail-under=60
      - run: uv run pytest --cov=src/task_api --cov-branch --cov-report=json:artifacts/coverage-branches.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: artifacts/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build, migrations, CLI, HTTP smoke and tests in Docker
        run: python3 scripts/ci_docker.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-docker
          path: artifacts/docker/
